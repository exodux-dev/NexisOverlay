name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Package portable build
        shell: pwsh
        run: |
          $dir = "NexisOverlay-portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "src-tauri/target/release/nexis-overlay.exe" "$dir/Nexis Overlay.exe"
          @"
          Nexis Overlay - portable build

          Run "Nexis Overlay.exe". Everything (settings, match history, caches) is saved in the
          "data" folder created next to it - nothing is written to AppData.
          To uninstall, close Nexis from the tray and delete this folder.

          Requires the Microsoft Edge WebView2 Runtime (preinstalled on Windows 10/11).
          Set League to Borderless (Settings > Video > Window Mode). Open the overlay with Ctrl+Shift+Space.
          "@ | Set-Content -Path "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path "$dir/*" -DestinationPath "NexisOverlay-portable.zip" -Force
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: NexisOverlay-portable
          path: NexisOverlay-portable/
          if-no-files-found: error
      # Releases publish themselves: bump the version in package.json and add
      # docs/releases/v<version>.md. The first push to main with that version (and no release
      # yet) creates the tag and the release, with those notes and this build's zip.
      # Pushing a v* tag by hand still works too.
      - name: Release check
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { $tag = "${{ github.ref_name }}" }
          $notes = Test-Path "docs/releases/$tag.md"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          $isMain = "${{ github.ref }}" -eq "refs/heads/main" -and "${{ github.event_name }}" -eq "push"
          $publish = $notes -and ($isTag -or ($isMain -and -not $exists))
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "version $tag | notes: $notes | release exists: $exists | publish: $publish"
          exit 0
      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nexis Overlay ${{ steps.rel.outputs.tag }}
          body_path: docs/releases/${{ steps.rel.outputs.tag }}.md
          files: NexisOverlay-portable.zip
