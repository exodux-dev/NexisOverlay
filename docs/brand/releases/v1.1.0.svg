<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nexis Overlay v1.1.0: Calmer in-game HUD, Level-up arrow, CS tracking, Runes redone, Recording fixed">
  <title>Nexis Overlay v1.1.0</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="26"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="ver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a99bff"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4" stop-opacity=".7"/><stop offset=".5" stop-color="#a99bff" stop-opacity=".5"/><stop offset="1" stop-color="#7c6cff" stop-opacity=".7"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#card)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="300" fill="#0a0d16"/>
    <g filter="url(#blur)">
      <circle cx="140" cy="20" r="200" fill="#5b47d6" opacity=".75"><animateTransform attributeName="transform" type="translate" values="0 0;60 30;0 0" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="300" r="210" fill="#0f766e" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0;-60 -30;0 0" dur="16s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(1040 120) scale(4.2) translate(-12 -12)" filter="url(#glow)" opacity=".9">
      <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="url(#hex)" opacity=".18"/>
      <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="none" stroke="url(#hex)" stroke-width="1.1" stroke-dasharray="52" stroke-dashoffset="52"><animate attributeName="stroke-dashoffset" from="52" to="0" begin=".2s" dur="1.1s" fill="freeze"/></path>
      <path d="M8.5 16V8l7 8V8" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="25" stroke-dashoffset="25"><animate attributeName="stroke-dashoffset" from="25" to="0" begin=".7s" dur=".8s" fill="freeze"/></path>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin=".3s" dur=".6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin=".3s" dur=".6s" fill="freeze"/>
      <text x="72" y="78" font-size="15" font-weight="800" letter-spacing="5" fill="#a99bff">NEXIS OVERLAY · RELEASE</text>
      <text x="68" y="168" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#ver)">v1.1.0</text>
    </g>
    <g opacity="0" transform="translate(72 214)"><animate attributeName="opacity" from="0" to="1" begin="1.10s" dur=".5s" fill="freeze"/><rect width="205" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".45"/><text x="102" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#eef0f7">Calmer in-game HUD</text></g><g opacity="0" transform="translate(289 214)"><animate attributeName="opacity" from="0" to="1" begin="1.22s" dur=".5s" fill="freeze"/><rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".45"/><text x="84" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#eef0f7">Level-up arrow</text></g><g opacity="0" transform="translate(469 214)"><animate attributeName="opacity" from="0" to="1" begin="1.34s" dur=".5s" fill="freeze"/><rect width="141" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".45"/><text x="70" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#eef0f7">CS tracking</text></g><g opacity="0" transform="translate(622 214)"><animate attributeName="opacity" from="0" to="1" begin="1.46s" dur=".5s" fill="freeze"/><rect width="150" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".45"/><text x="75" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#eef0f7">Runes redone</text></g><g opacity="0" transform="translate(784 214)"><animate attributeName="opacity" from="0" to="1" begin="1.58s" dur=".5s" fill="freeze"/><rect width="178" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".45"/><text x="89" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#eef0f7">Recording fixed</text></g>
    <rect x="-400" y="0" width="300" height="300" fill="url(#shine)" transform="skewX(-18)"><animate attributeName="x" values="-400;1500;1500" keyTimes="0;.35;1" dur="7s" begin="1.8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="25.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>
</svg>
