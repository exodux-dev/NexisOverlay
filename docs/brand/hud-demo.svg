<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="The Nexis in-game HUD fades while you play and wakes up when you have a skill point or gold to spend">
  <title>Nexis in-game HUD</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="430" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="qglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c6cff" stop-opacity=".6"/><stop offset=".5" stop-color="#a99bff" stop-opacity=".45"/><stop offset="1" stop-color="#5eead4" stop-opacity=".65"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <clipPath id="ic1"><rect width="46" height="46" rx="6"/></clipPath>
    <clipPath id="ic3"><rect width="38" height="38" rx="6"/></clipPath>
    <clipPath id="champ"><circle cx="20" cy="20" r="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="430" fill="#0a0d16"/>
    <g filter="url(#blur)">
      <circle cx="140" cy="380" r="200" fill="#312e81" opacity=".8"><animateTransform attributeName="transform" type="translate" values="0 0;50 -30;0 0" dur="15s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="210" r="210" fill="#0f766e" opacity="0"><animate attributeName="opacity" values=".15;.15;.6;.6;.15;.15" keyTimes="0;.3;.36;.91;.99;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="40" r="170" fill="#5b47d6" opacity=".55"/>
    </g>

    <!-- left: captions that follow the HUD -->
    <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
      <text x="90" y="150" font-size="15" font-weight="700" letter-spacing="5" fill="#a99bff">IN GAME</text>
      <g>
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.3;.36;.91;.99;1" dur="8s" repeatCount="indefinite"/>
        <text x="88" y="210" font-size="50" font-weight="700" letter-spacing="-1" fill="#ffffff">Fades away</text>
        <text x="88" y="268" font-size="50" font-weight="700" letter-spacing="-1" fill="#ffffff">while you play.</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.3;.36;.91;.99;1" dur="8s" repeatCount="indefinite"/>
        <text x="88" y="210" font-size="50" font-weight="700" letter-spacing="-1" fill="#ffffff">Back when</text>
        <text x="88" y="268" font-size="50" font-weight="700" letter-spacing="-1" fill="#5eead4">it matters.</text>
      </g>
      <text x="90" y="316" font-size="19" fill="#9aa1bd">Gold to spend, a skill point, augments on screen.</text>
    </g>

    <!-- right: the HUD panel -->
    <g transform="translate(700 60)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
      <g filter="url(#shadow)">
        <animate attributeName="opacity" values=".24;.24;1;1;.24;.24" keyTimes="0;.3;.36;.91;.99;1" dur="8s" repeatCount="indefinite"/>
        <rect width="410" height="310" rx="18" fill="#141724" stroke="#2c3044"/>
        <!-- header -->
        <g transform="translate(22 18)">
          <g clip-path="url(#champ)"><image width="40" height="40" xlink:href="data:image/jpeg;base64,"/></g>
          <circle cx="20" cy="20" r="20" fill="none" stroke="#7c6cff" stroke-opacity=".7" stroke-width="1.5"/>
          <text x="54" y="26" font-size="14" font-weight="800" letter-spacing="3" fill="#a99bff">NEXIS</text>
          <circle cx="318" cy="21" r="8" fill="#e7b84b"/><text x="318" y="25" font-size="10" font-weight="800" text-anchor="middle" fill="#7a5a12">+</text>
          <text x="332" y="27" font-size="17" font-weight="700" fill="#f3d27a">1,350</text>
        </g>
        <text x="22" y="86" font-size="12" font-weight="800" letter-spacing="2" fill="#5eead4">BUY NOW</text>
        <g transform="translate(22 96)">
          <g clip-path="url(#ic1)"><image width="46" height="46" xlink:href="data:image/jpeg;base64,"/></g>
          <rect width="46" height="46" rx="6" fill="none" stroke="#5eead4" stroke-width="1.5"/>
          <text x="62" y="30" font-size="19" font-weight="600" fill="#eef0f7">Oblivion Orb</text>
          <text x="366" y="30" font-size="16" font-weight="700" text-anchor="end" fill="#5eead4">800</text>
        </g>
        <g transform="translate(22 150)">
          <g clip-path="url(#ic1)"><image width="46" height="46" xlink:href="data:image/jpeg;base64,"/></g>
          <rect width="46" height="46" rx="6" fill="none" stroke="#5eead4" stroke-width="1.5"/>
          <text x="62" y="30" font-size="19" font-weight="600" fill="#eef0f7">Amplifying Tome</text>
          <text x="366" y="30" font-size="16" font-weight="700" text-anchor="end" fill="#5eead4">400</text>
        </g>
        <g transform="translate(22 206)">
          <g clip-path="url(#ic3)"><image width="38" height="38" xlink:href="data:image/jpeg;base64,"/></g>
          <text x="52" y="18" font-size="11.5" font-weight="800" letter-spacing="1.5" fill="#a99bff">SAVE FOR</text>
          <text x="128" y="18" font-size="16" font-weight="600" fill="#eef0f7">Luden's Echo</text>
          <text x="366" y="18" font-size="15" font-weight="700" text-anchor="end" fill="#f3c95c">2,275 more</text>
          <rect x="52" y="27" width="314" height="5" rx="2.5" fill="#262a3b"/>
          <rect x="52" y="27" width="110" height="5" rx="2.5" fill="url(#bar)"/>
        </g>
        <line x1="22" y1="254" x2="388" y2="254" stroke="#262a3b"/>
        <!-- skills -->
        <g transform="translate(22 264)">
          <text y="27" font-size="12" font-weight="800" letter-spacing="2" fill="#5eead4" opacity="0">LEVEL UP<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.3;.36;.91;.99;1" dur="8s" repeatCount="indefinite"/></text>
          <text y="27" font-size="12" font-weight="800" letter-spacing="2" fill="#a99bff">NEXT<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.3;.36;.91;.99;1" dur="8s" repeatCount="indefinite"/></text>
          <g transform="translate(96 0)">
            <g>
              <rect width="58" height="40" rx="14" fill="#1c2030" stroke="#33384d"/>
              <rect width="58" height="40" rx="14" fill="#0f2f2d" stroke="#5eead4" stroke-width="2" filter="url(#qglow)" opacity="0">
                <animate attributeName="opacity" values="0;0;1;.55;1;.55;1;0;0" keyTimes="0;.32;.38;.5;.62;.74;.86;.94;1" dur="8s" repeatCount="indefinite"/>
              </rect>
              <text x="29" y="26" font-size="18" font-weight="800" text-anchor="middle" fill="#eef0f7">Q</text>
            </g>
            <g transform="translate(68 0)"><rect width="58" height="40" rx="14" fill="#1c2030" stroke="#33384d"/><text x="29" y="26" font-size="18" font-weight="800" text-anchor="middle" fill="#c9cde0">W</text></g>
            <g transform="translate(136 0)"><rect width="58" height="40" rx="14" fill="#1c2030" stroke="#33384d"/><text x="29" y="26" font-size="18" font-weight="800" text-anchor="middle" fill="#c9cde0">E</text><circle cx="18" cy="35" r="2" fill="#7c6cff"/></g>
            <g transform="translate(204 0)"><rect width="58" height="40" rx="14" fill="#1c2030" stroke="#33384d"/><text x="29" y="26" font-size="18" font-weight="800" text-anchor="middle" fill="#c9cde0">R</text></g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="428.5" rx="27.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>
</svg>
