<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Nexis Overlay: a calm League of Legends companion">
  <title>Nexis Overlay</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".7"/><stop offset=".5" stop-color="#a99bff" stop-opacity=".55"/><stop offset="1" stop-color="#7c6cff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9e6ff"/><stop offset="1" stop-color="#b9adff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hexes" width="28" height="48" patternUnits="userSpaceOnUse">
      <path d="M14 0l14 8v16l-14 8L0 24V8z" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="hexMask"><rect width="1200" height="340" fill="url(#fadeR)"/></mask>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0a0d16"/>
    <!-- drifting glows -->
    <g filter="url(#blur)">
      <circle cx="170" cy="40" r="210" fill="#5b47d6" opacity=".75">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 40; 0 0" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      </circle>
      <circle cx="1080" cy="330" r="220" fill="#0f766e" opacity=".75">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 -30; 0 0" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      </circle>
      <circle cx="700" cy="-40" r="170" fill="#312e81" opacity=".8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 50 50; 0 0" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      </circle>
    </g>
    <rect width="1200" height="340" fill="url(#hexes)" opacity=".07" mask="url(#hexMask)"/>

    <!-- logo: the hexagon draws itself, then glows -->
    <g transform="translate(150 170)">
      <circle r="78" fill="#5eead4" opacity=".08">
        <animate attributeName="r" values="70;84;70" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".05;.13;.05" dur="4s" repeatCount="indefinite"/>
      </circle>
      <g transform="scale(5.4) translate(-12 -12)" filter="url(#glow)">
        <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="url(#hexStroke)" opacity="0">
          <animate attributeName="opacity" from="0" to=".22" begin="1.1s" dur=".8s" fill="freeze"/>
        </path>
        <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="none" stroke="url(#hexStroke)" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="52" stroke-dashoffset="52">
          <animate attributeName="stroke-dashoffset" from="52" to="0" begin=".2s" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"/>
        </path>
        <path d="M8.5 16V8l7 8V8" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="25" stroke-dashoffset="25">
          <animate attributeName="stroke-dashoffset" from="25" to="0" begin=".75s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"/>
        </path>
      </g>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin=".6s" dur=".7s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin=".6s" dur=".7s" fill="freeze" calcMode="spline" keySplines=".2 0 .2 1"/>
        <text x="270" y="112" font-size="15" font-weight="700" letter-spacing="5" fill="#a99bff">FREE · OPEN SOURCE · LIGHTWEIGHT</text>
        <text x="266" y="178" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Nexis Overlay</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin=".95s" dur=".7s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin=".95s" dur=".7s" fill="freeze" calcMode="spline" keySplines=".2 0 .2 1"/>
        <text x="270" y="220" font-size="23" fill="#b7bdd6">Builds, augments, runes and a calm in-game HUD.</text>
      </g>
      <!-- mode chips -->
      <g font-size="15" font-weight="600" fill="#e9ebf5">
        <g opacity="0" transform="translate(270 248)">
          <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur=".5s" fill="freeze"/>
          <rect width="136" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".4"/><text x="68" y="22" text-anchor="middle">ARAM: Mayhem</text>
        </g>
        <g opacity="0" transform="translate(418 248)">
          <animate attributeName="opacity" from="0" to="1" begin="1.38s" dur=".5s" fill="freeze"/>
          <rect width="78" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".4"/><text x="39" y="22" text-anchor="middle">ARAM</text>
        </g>
        <g opacity="0" transform="translate(508 248)">
          <animate attributeName="opacity" from="0" to="1" begin="1.51s" dur=".5s" fill="freeze"/>
          <rect width="80" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".4"/><text x="40" y="22" text-anchor="middle">Arena</text>
        </g>
        <g opacity="0" transform="translate(600 248)">
          <animate attributeName="opacity" from="0" to="1" begin="1.64s" dur=".5s" fill="freeze"/>
          <rect width="158" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#a99bff" stroke-opacity=".4"/><text x="79" y="22" text-anchor="middle">Summoner's Rift</text>
        </g>
      </g>
    </g>

    <!-- a slow light sweep -->
    <rect x="-400" y="0" width="300" height="340" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-400;1500;1500" keyTimes="0;.35;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="27.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>
</svg>
