name: Source health

# Once a day: fetch a few real OP.GG / HexMayhem pages and run Nexis' parsers on them
# (scripts/check-sources.ts). A failure means a site changed its page format, so builds would
# silently fall back to the baseline; GitHub emails the repo owner about failed runs.
# Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run check:sources
