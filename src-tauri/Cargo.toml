[package]
name = "nexis-overlay"
version = "1.1.0"
description = "Open-source, lightweight League of Legends ARAM Mayhem overlay"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nexis_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "fs"] }
# native-tls => SChannel on Windows (no C toolchain needed, small binary)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(windows)'.dependencies]
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
] }

[profile.release]
# Small + lean binary
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
